<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cài đặt — Dịch sự kiện trực tiếp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="shell">
      <header>
        <h1>Gemini API key</h1>
        <p>
          Extension tự tạo token phiên và gọi Gemini Live Translate. Key chỉ
          lưu trên máy bạn (<code>chrome.storage.local</code>), không gửi lên
          server demo.
        </p>
      </header>

      <div class="field">
        <label for="geminiApiKey">API key</label>
        <input
          id="geminiApiKey"
          type="password"
          placeholder="Dán Gemini API key"
          autocomplete="off"
          spellcheck="false"
        />
        <p class="hint">
          Lấy key tại
          <a
            href="https://aistudio.google.com/apikey"
            target="_blank"
            rel="noreferrer"
            >Google AI Studio</a
          >.
        </p>
      </div>

      <div class="actions">
        <button id="saveButton" type="button">Lưu</button>
        <button id="clearButton" type="button" class="secondary">Xóa key</button>
      </div>
      <p id="status" role="status"></p>
    </main>

    <script src="options.js" type="module"></script>
  </body>
</html>
